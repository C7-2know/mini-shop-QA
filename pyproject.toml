[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minishop-automation"
version = "1.0.0"
description = "Production-style automation suite for MiniShop e-commerce application"
authors = [{name = "Test Team", email = "test@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytest>=8.4.2",
    "pytest-html>=4.1.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-playwright>=0.7.1",
    "pytest-asyncio>=0.24.0",
    "requests>=2.32.5",
    "playwright>=1.55.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.0.1",
    "faker>=37.8.0",
]

[tool.pytest.ini_options]
testpaths = ["api", "ui/tests", "common"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--html=reports/report.html",
    "--self-contained-html",
    "--junitxml=reports/junit.xml",
    "--cov=.",
    "--cov-report=html:reports/coverage",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
markers = [
    "ui: UI tests using Playwright",
    "api: API tests using requests",
    "smoke: Smoke tests",
    "regression: Regression tests",
    "slow: Slow running tests",
    "happy_path: Happy path tests",
    "negative: Negative test cases",
    "functional: Functional tests",
    "non_functional: Non-functional tests",
    "accessibility: Accessibility tests",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | \.pytest_cache
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    ".pytest_cache",
]
