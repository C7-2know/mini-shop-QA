name: MiniShop Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start backend server
      run: |
        cd mocks/backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
    
    - name: Run API tests
      run: |
        pytest tests/api/ -v --html=reports/api-report.html --self-contained-html --junitxml=reports/api-junit.xml -m api
    
    - name: Upload API test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: api-test-results
        path: reports/

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      run: playwright install chromium
    
    - name: Start backend server
      run: |
        cd mocks/backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
    
    - name: Start frontend server
      run: |
        cd mocks/frontend/product-ui
        npm install
        npm start &
        sleep 30
        curl -f http://localhost:3000 || exit 1
    
    - name: Run UI tests
      run: |
        pytest ui/tests -v --html=reports/ui-report.html --self-contained-html --junitxml=reports/ui-junit.xml -m ui
    
    - name: Upload UI test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ui-test-results
        path: reports/

  parallel-tests:
    name: Parallel Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [api-tests, ui-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Playwright browsers
      run: playwright install chromium
    
    - name: Start backend server
      run: |
        cd mocks/backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
    
    - name: Start frontend server
      run: |
        cd mocks/frontend/product-ui
        npm install
        npm start &
        sleep 30
        curl -f http://localhost:3000 || exit 1
    
    - name: Run all tests in parallel
      run: |
        pytest tests/ -v --html=reports/combined-report.html --self-contained-html --junitxml=reports/combined-junit.xml --cov=. --cov-report=html:reports/coverage -n auto
    
    - name: Upload combined test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: combined-test-results
        path: reports/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests, parallel-tests]
    if: always()
    
    steps:
    - name: Download API test results
      uses: actions/download-artifact@v3
      with:
        name: api-test-results
        path: api-results/
    
    - name: Download UI test results
      uses: actions/download-artifact@v3
      with:
        name: ui-test-results
        path: ui-results/
    
    - name: Download combined test results
      uses: actions/download-artifact@v3
      with:
        name: combined-test-results
        path: combined-results/
    
    - name: Generate test summary
      run: |
        echo "# Test Results Summary" > test-summary.md
        echo "" >> test-summary.md
        echo "## API Tests" >> test-summary.md
        if [ -f "api-results/api-report.html" ]; then
          echo "✅ API tests completed - [View Report](api-results/api-report.html)" >> test-summary.md
        else
          echo "❌ API tests failed or not found" >> test-summary.md
        fi
        echo "" >> test-summary.md
        echo "## UI Tests" >> test-summary.md
        if [ -f "ui-results/ui-report.html" ]; then
          echo "✅ UI tests completed - [View Report](ui-results/ui-report.html)" >> test-summary.md
        else
          echo "❌ UI tests failed or not found" >> test-summary.md
        fi
        echo "" >> test-summary.md
        echo "## Combined Results" >> test-summary.md
        if [ -f "combined-results/combined-report.html" ]; then
          echo "✅ Combined tests completed - [View Report](combined-results/combined-report.html)" >> test-summary.md
        else
          echo "❌ Combined tests failed or not found" >> test-summary.md
        fi
    
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test-summary.md

