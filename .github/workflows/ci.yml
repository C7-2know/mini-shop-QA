name: MiniShop Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r mocks/backend/requirements.txt
    
    - name: Start backend server
      run: |
        cd mocks/backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
    
    - name: Run API tests
      run: |
        pytest api/ -v --html=reports/api-report.html --self-contained-html --junitxml=reports/api-junit.xml -m api
    
    - name: Upload API test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-results
        path: reports/

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r mocks/backend/requirements.txt

    
    - name: Install Playwright browsers
      run: playwright install chromium
    
    - name: Start backend server
      run: |
        cd mocks/backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
    
    - name: Start frontend server
      run: |
        cd mocks/frontend/product-ui
        npm install
        npm start &
        sleep 30
        curl -f http://localhost:3000 || exit 1
    
    - name: Run UI tests
      run: |
        pytest ui/tests -v --html=reports/ui-report.html --self-contained-html --junitxml=reports/ui-junit.xml -m ui
    
    - name: Upload UI test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-test-results
        path: reports/
    - name: Run all tests
      run: |
        pytest -v --html=reports/combined-report.html --self-contained-html --junitxml=reports/combined-junit.xml -m "ui or api"

    
